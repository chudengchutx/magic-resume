[package]
name = "magic-resume"
version = "1.0.0"
description = "Magic Resume - Professional Resume Builder for macOS"
authors = ["Magic Resume Team"]
edition = "2021"

[lib]
name = "magic_resume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
